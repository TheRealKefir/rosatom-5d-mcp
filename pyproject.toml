[project]
name = "rosatom-5d-mcp"
version = "0.2.0"
description = "MCP Server for Rosatom 3D/5D Additive Manufacturing — slicing, geometry analysis, safety"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=1.3.0,<2.0.0",
    "trimesh>=4.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "openai>=3.31.0",
    "langchain-core>=1.6.10",
    "pydantic-settings>=2.16.0",
    "networkx>=3.7",
    "rtree>=1.4.1",
    "pyvista>=0.49.1",
    "pillow>=12.3.0",
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "websockets>=17.2",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "qdrant-client>=1.19.1",
    "fastembed>=0.9.0",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
]

[project.scripts]
rosatom-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
