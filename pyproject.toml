[project]
name = "rosatom-5d-mcp"
version = "0.2.0"
description = "MCP Server for Rosatom 3D/5D Additive Manufacturing — slicing, geometry analysis, safety"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp[cli]>=1.3.0,<2.0.0",
    "trimesh>=4.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
]

[project.scripts]
rosatom-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
