[project]
name = "rosatom-orchestrator"
version = "2.0.0"
description = "Chat backend & LLM agent orchestrator for the Rosatom 5D MCP system"
requires-python = ">=3.11"
dependencies = [
    # --- MCP и LLM/VLM Оркестрация ---
    "mcp[cli]>=1.3.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # --- Бэкенд, Асинхронность и Очереди ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "websockets>=14.2",
    "celery>=5.4.0",
    "redis>=5.2.0",

    # --- База знаний (RAG) ---
    "qdrant-client>=1.13.0",
    "fastembed>=0.5.0",

    # --- Утилиты ---
    "loguru>=0.7.3",
    "jinja2>=3.1.5",
    "pillow>=11.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
